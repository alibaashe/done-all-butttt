    <meta property="og:title" content="Wadaage" />

  </head>
  <body>
    <div id="root"></div>
    <script>
      window.gm_authFailure = function () {
        console.warn('[Google Maps] Referrer or Auth restriction detected. Activating MapLibre layer.');
        window.__googleMapsAuthFailed = true;
        window.dispatchEvent(new CustomEvent('google-maps-auth-failure'));
      };
      window.addEventListener('error', function (event) {
        if (event && (event.message && (event.message.includes('RefererNotAllowedMapError') || event.message.includes('Google Maps JavaScript API error')))) {
          console.warn('[Google Maps] RefererNotAllowedMapError caught gracefully.');
          window.__googleMapsAuthFailed = true;
          window.dispatchEvent(new CustomEvent('google-maps-auth-failure'));
          if (event.preventDefault) event.preventDefault();
        }
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
