<svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Navy/Black Background -->
    <radialGradient id="badgeBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1e38" />
      <stop offset="65%" stop-color="#040e1c" />
      <stop offset="100%" stop-color="#020710" />
    </radialGradient>

    <!-- Split Halo Ring: Lime Green to Electric Cyan/Blue -->
    <linearGradient id="orbitGreenBlue" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="35%" stop-color="#00E676" />
      <stop offset="70%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <linearGradient id="neonBlueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00B4D8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.95" />
    </linearGradient>

    <!-- Lime Pin Gradient -->
    <linearGradient id="limePinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="60%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="neonPinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E676" flood-opacity="0.75" />
    </filter>

    <filter id="blueRingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00B4D8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- BASE DARK CIRCULAR CANVAS -->
  <circle cx="160" cy="160" r="150" fill="url(#badgeBgGrad)" />

  <!-- 1. OUTER DUAL GLOWING HALO RINGS (Green + Blue Orbit) -->
  <g filter="url(#blueRingGlow)">
    <circle
      cx="160"
      cy="160"
      r="142"
      stroke="url(#orbitGreenBlue)"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />
    <circle
      cx="160"
      cy="160"
      r="130"
      stroke="url(#neonBlueRing)"
      stroke-width="2.5"
      stroke-dasharray="14 8 35 12"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- 2. TOP GLOWING NEON MAP PIN OVER CAR -->
  <g filter="url(#neonPinGlow)">
    <path
      d="M 160 36 C 147 36 137 46 137 59 C 137 74 160 97 160 97 C 160 97 183 74 183 59 C 183 46 173 36 160 36 Z"
      fill="url(#limePinGrad)"
    />
    <circle cx="160" cy="57" r="8" fill="#040e1c" />
  </g>

  <!-- 3. DETAILED WHITE CAR WITH 3 COMMUTERS INSIDE -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path
      d="M 108 116 C 114 93 128 82 144 80 L 176 80 C 192 82 206 93 212 116 C 218 120 226 124 226 132 C 226 138 220 143 216 144 L 216 156 L 196 156 L 196 153 C 174 155 146 155 124 153 L 124 156 L 104 156 L 104 144 C 100 143 94 138 94 132 C 94 124 102 120 108 116 Z"
      fill="#06182c"
    />
    <path d="M 112 115 L 208 115" stroke-width="3" />
    <path d="M 132 115 L 138 88" stroke-width="2.5" />
    <path d="M 188 115 L 182 88" stroke-width="2.5" />

    <!-- 3 Commuters inside car -->
    <circle cx="132" cy="107" r="7" fill="#FFFFFF" />
    <path d="M 121 123 C 121 116 126 113 132 113 C 138 113 143 116 143 123 Z" fill="#FFFFFF" />

    <circle cx="160" cy="103" r="8.5" fill="#FFFFFF" />
    <path d="M 148 123 C 148 114 153 111 160 111 C 167 111 172 114 172 123 Z" fill="#FFFFFF" />

    <circle cx="188" cy="107" r="7" fill="#FFFFFF" />
    <path d="M 177 123 C 177 116 182 113 188 113 C 194 113 199 116 199 123 Z" fill="#FFFFFF" />

    <path d="M 104 136 C 110 137 116 141 118 145" stroke="#00E676" stroke-width="4" stroke-linecap="round" />
    <path d="M 216 136 C 210 137 204 141 202 145" stroke="#00E676" stroke-width="4" stroke-linecap="round" />

    <path d="M 142 145 L 178 145" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 4. UNDER-CAR HORIZON ARCH -->
  <path
    d="M 64 174 C 115 158, 205 158, 256 174"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 5. 'wadaage' CLEAN DOUBLE-TRACK TYPOGRAPHY -->
  <g transform="translate(14, 150) scale(0.65)">
    <g filter="url(#neonPinGlow)">
      <path
        d="M 52 10 C 40 10 30 20 30 32 C 30 46 52 66 52 66 C 52 66 74 46 74 32 C 74 20 64 10 52 10 Z"
        fill="url(#limePinGrad)"
      />
      <circle cx="52" cy="30" r="7.5" fill="#040e1c" />
    </g>

    <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 16 38 L 38 106 L 63 50 L 88 106 L 110 38" />
      <path d="M 27 40 L 43 90 L 63 60 L 83 90 L 99 40" stroke-width="2.5" />

      <circle cx="138" cy="78" r="22" />
      <path d="M 160 56 L 160 100 C 160 102 163 103 165 103" />
      <circle cx="138" cy="78" r="14" stroke-width="2.5" />

      <circle cx="198" cy="78" r="22" />
      <path d="M 220 26 L 220 100 C 220 102 223 103 225 103" />
      <circle cx="198" cy="78" r="14" stroke-width="2.5" />

      <circle cx="258" cy="78" r="22" />
      <path d="M 280 56 L 280 100 C 280 102 283 103 285 103" />
      <circle cx="258" cy="78" r="14" stroke-width="2.5" />

      <circle cx="318" cy="78" r="22" />
      <path d="M 340 56 L 340 100 C 340 102 343 103 345 103" />
      <circle cx="318" cy="78" r="14" stroke-width="2.5" />

      <circle cx="376" cy="78" r="21" />
      <path d="M 397 57 L 397 101 C 397 118 375 122 360 116" />
      <circle cx="376" cy="78" r="13" stroke-width="2.5" />

      <path d="M 456 82 C 456 62 441 54 424 54 C 404 54 391 67 391 80 C 391 96 404 104 424 104 C 439 104 450 97 454 90" />
    </g>

    <line x1="409" y1="75" x2="458" y2="75" stroke="#00E676" stroke-width="5.5" stroke-linecap="round" />
    <line x1="409" y1="84" x2="458" y2="84" stroke="#00E676" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- 6. SIGNATURE "— Share —" WITH SPEED LINES ACCENTS -->
  <g transform="translate(85, 235)">
    <!-- 3 Green Speed Lines on Left -->
    <line x1="0" y1="5" x2="16" y2="5" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" />
    <line x1="4" y1="10" x2="22" y2="10" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="15" x2="20" y2="15" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" />

    <!-- Word "Share" in vibrant green -->
    <text x="34" y="14" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#00E676" letter-spacing="1.5">Share</text>

    <!-- Speed Line on Right -->
    <line x1="96" y1="10" x2="145" y2="10" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 7. BOTTOM SUBTLE NEON ACCENT ARC -->
  <path
    d="M 100 270 C 135 280, 185 280, 220 270"
    stroke="url(#orbitGreenBlue)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
</svg>
